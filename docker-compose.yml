# Optional one-command demo: API container + Streamlit container.
# The assignment deliverable is the `api` target run with plain docker run.
services:
  api:
    build:
      context: .
      target: api
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 5

  ui:
    build:
      context: .
      target: ui
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
